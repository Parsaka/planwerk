name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "ruff>=0.5"
      - run: ruff check src tests eval scripts

  test:
    # generator (CI profile) -> dbt build with all tests -> forecast, liquidity -> assistant eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dbt,assistant,reporting,dev]"
      - run: pytest -q
      - name: Q3 evaluation on CI data (offline provider)
        run: |
          make generate dbt forecast PROFILE=ci
          python -m planwerk.assistant.eval --out eval-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-eval-ci
          path: eval-ci.json

  cap:
    # SAP CAP service: tests with mocked users, then the HANA (HDI) build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sap/cap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: sap/cap/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npx cds build --production

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform fmt -check -recursive infra/terraform
      - name: validate snowflake stack
        working-directory: infra/terraform/snowflake
        run: terraform init -backend=false -input=false && terraform validate
      - name: validate azure stack
        working-directory: infra/terraform/azure
        run: terraform init -backend=false -input=false && terraform validate
