_schema-version: "3.1"
ID: planwerk-cap
version: 0.1.0
description: Planwerk controlling service on SAP BTP (Cloud Foundry) with SAP HANA Cloud. Simulated data.
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: planwerk-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: planwerk-db
      - name: planwerk-auth

  - name: planwerk-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    requires:
      - name: planwerk-db

resources:
  - name: planwerk-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: planwerk-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: planwerk-cap-${org}-${space}
        tenant-mode: dedicated
