# Data contract between the S/4HANA extract and the Planwerk warehouse. Checked by tests/test_contracts.py
# on every CI run; dbt marts with consumers additionally have enforced dbt model contracts.
contract: s4_sources
version: 1.0.0
owner: Plattform-Owner Planwerk
consumer: dbt staging (models/staging)
source: S/4HANA extract (simulated Nordwerk GmbH, generator v0.1.0)
sla:
  delivery: workday 2 after period end
  completeness: all documents of the period, row counts in manifest.json
  freshness: period end + 2 workdays
rules:
- Every listed column is present with the listed type; extra columns are allowed (additive changes).
- Primary key columns are not null and unique.
- 'Removing or retyping a column is a breaking change: new major version, announced one closing in advance.'
- Amounts are signed (debit positive, credit negative) in HSL/KSL/TSL; currencies in RHCUR/RKCUR/RWCUR.
